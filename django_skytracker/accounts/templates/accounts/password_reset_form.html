{% extends "accounts/base.html" %}

{% block title %}Reset your password | SkyTracker{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p>Enter the email address on your SkyTracker account and choose a new password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set new password</button>
  </form>
{% endblock %}
